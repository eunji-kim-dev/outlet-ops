spring.application.name=outlet-ops-backend

# 로컬 개발에서는 파일을 읽고 배포 환경에서는 시스템 환경변수 사용
spring.config.import=optional:file:.env.properties

# 로컬 기본값과 운영 환경변수를 함께 지원하는 DB 연결 설정
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/outlet_ops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:outletops}
spring.datasource.password=${DB_PASSWORD}

# 운영 환경에서 환경변수로 변경 가능한 JPA 설정
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Railway가 제공하는 PORT 사용, 로컬에서는 8080 사용
server.port=${PORT:8080}
server.address=0.0.0.0

# 쉼표로 구분된 프론트엔드 주소만 API 요청 허용
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
