spring.application.name=outlet-ops-backend

spring.config.import=optional:file:.env.properties

spring.datasource.url=jdbc:mysql://localhost:3306/outlet_ops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=outletops
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080